name: Portable release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-release:
    if: github.repository == 'Realm667/DoomLauncher667'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate version tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+(?:-(?:rc|beta)\.[1-9]\d*)?)$') {
            throw "Unsupported release tag: $env:GITHUB_REF_NAME"
          }
          $version = $Matches[1]
          ./deployment/test-release-version.ps1
          "number=$version" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append

      - name: Restore
        run: |
          dotnet restore DoomLauncher.WinUI/DoomLauncher.WinUI.csproj
          dotnet restore DoomLauncher.Modern.Tests/DoomLauncher.Modern.Tests.csproj
          dotnet restore DoomLauncher.Bootstrap/DoomLauncher.Bootstrap.csproj

      - name: Test
        run: dotnet run --project DoomLauncher.Modern.Tests/DoomLauncher.Modern.Tests.csproj -c Release --no-restore

      - name: Test first setup
        shell: pwsh
        run: dotnet run --project DoomLauncher.Modern.Tests/DoomLauncher.Modern.Tests.csproj -c Release --no-restore -- --verify-first-setup

      - name: Test portable reset contract
        shell: pwsh
        run: ./deployment/test-reset-instance.ps1

      - name: Build portable package
        id: package
        shell: pwsh
        run: ./deployment/package-release.ps1 -Version "${{ steps.version.outputs.number }}" -OutputDirectory "$env:RUNNER_TEMP\release"

      - name: Test portable update compatibility
        shell: pwsh
        run: ./deployment/test-portable-update.ps1 -PackageDirectory "${{ steps.package.outputs.package }}"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          $release = ./deployment/release-version.ps1 -Version $env:VERSION
          $notesPath = "docs/releases/$env:VERSION.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Release notes required: $notesPath"
          }
          if (gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $env:GITHUB_REF_NAME `
              $env:ARCHIVE `
              $env:CHECKSUM `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $env:GITHUB_REF_NAME `
              $env:ARCHIVE `
              $env:CHECKSUM `
              --verify-tag `
              $release.PublishFlag `
              --title $release.Title `
              --notes-file $notesPath `
              --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
